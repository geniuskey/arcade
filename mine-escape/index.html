<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>광산 탈출 - Mine Escape</title>
  <style>
    :root {
      --ink: #070908;
      --coal: #101512;
      --iron: #68736d;
      --amber: #f7b955;
      --mint: #6ee7b7;
      --danger: #ff5b4d;
      --paper: #f4efe4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050706;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--paper);
      font-family: "Arial Narrow", "Noto Sans KR", Arial, sans-serif;
      background:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px),
        #050706;
      background-size: 36px 36px;
    }

    .back-button {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #eef2ee;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(7, 10, 8, 0.78);
      backdrop-filter: blur(8px);
      font-size: 22px;
      line-height: 1;
    }

    .back-button:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    #game-shell {
      position: relative;
      width: min(900px, calc(100vw - 18px));
      aspect-ratio: 900 / 620;
      max-height: calc(100vh - 18px);
      overflow: hidden;
      border: 1px solid #3f4943;
      border-radius: 8px;
      background: #0a0d0b;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.72), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 28px;
      background: rgba(4, 7, 5, 0.88);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .helmet-mark {
      position: relative;
      width: 82px;
      height: 82px;
      margin-bottom: 18px;
      border: 8px solid #d2a84f;
      border-radius: 48% 48% 42% 42%;
      background: #2e3531;
      box-shadow: 0 0 36px rgba(247, 185, 85, 0.22);
    }

    .helmet-mark::before {
      content: "";
      position: absolute;
      inset: 13px 9px 20px;
      border: 3px solid #93a39b;
      border-radius: 45% 45% 34% 34%;
      background: linear-gradient(145deg, #b9e7d8 0 13%, #29473f 18% 68%, #13201c 100%);
    }

    .helmet-mark::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 8px;
      left: 21px;
      bottom: 3px;
      border-radius: 2px;
      background: var(--amber);
      box-shadow: 0 0 14px var(--amber);
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--amber);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      color: #fff8e8;
      font-size: clamp(42px, 8vw, 68px);
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 6px 32px rgba(0, 0, 0, 0.8);
    }

    .mission-route {
      margin: 18px 0 24px;
      color: #b8c2bc;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .mission-route b {
      color: var(--mint);
    }

    .start-button {
      min-width: 170px;
      height: 48px;
      border: 1px solid #fbd17f;
      border-radius: 6px;
      color: #191306;
      background: var(--amber);
      font: 800 16px inherit;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(247, 185, 85, 0.18);
    }

    .start-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      color: #87918b;
      font-size: 11px;
      font-weight: 700;
    }

    .key {
      display: inline-grid;
      min-width: 28px;
      height: 24px;
      place-items: center;
      padding: 0 6px;
      margin-right: 4px;
      color: #dce4df;
      border: 1px solid #56615b;
      border-radius: 4px;
      background: #1a201c;
      box-shadow: inset 0 -2px 0 #0b0e0c;
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 7;
      min-width: 260px;
      max-width: calc(100% - 40px);
      padding: 10px 16px;
      color: #f8f2e6;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 5px;
      background: rgba(8, 12, 9, 0.86);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 700px) {
      .back-button {
        top: 8px;
        left: 8px;
      }

      .controls {
        display: none;
      }

      #toast {
        bottom: 76px;
      }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      #game-shell {
        width: min(900px, calc((100vh - 12px) * 1.4516));
      }
    }
  </style>
</head>

<body>
  <a href="../" class="back-button" title="아케이드로 돌아가기" aria-label="아케이드로 돌아가기">‹</a>

  <main id="game-shell">
    <canvas id="game" width="900" height="620" aria-label="광산 탈출 게임"></canvas>
    <div id="toast"></div>

    <section id="overlay" class="overlay active">
      <div class="helmet-mark" aria-hidden="true"></div>
      <div id="overlay-kicker" class="eyebrow">MINE 01 // DESCENT READY</div>
      <h1 id="overlay-title">광산 탈출</h1>
      <div id="overlay-route" class="mission-route"><b>광물 5개</b> → 열쇠함 → 탈출문</div>
      <button id="start-button" class="start-button" type="button">탐사 시작</button>
      <div class="controls">
        <span><span class="key">WASD</span><span class="key">↕</span> 이동</span>
        <span><span class="key">SPACE</span> 점프</span>
      </div>
    </section>
  </main>

  <script src="../mobile-arcade.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayKicker = document.getElementById('overlay-kicker');
    const overlayRoute = document.getElementById('overlay-route');
    const startButton = document.getElementById('start-button');
    const toast = document.getElementById('toast');

    const WIDTH = 900;
    const HEIGHT = 620;
    const HUD_HEIGHT = 68;
    const FLOOR = { left: 24, top: 78, right: 876, bottom: 596 };
    const PLAYER_RADIUS = 14;
    const JUMP_DURATION = 0.72;
    const TOTAL_MINERALS = 5;

    const STAGES = [
      {
        name: '폐광 입구',
        code: 'MINE 01',
        floor: '#171c18',
        floorAlt: '#1d231e',
        rock: '#354038',
        accent: '#d6a14c',
        start: { x: 78, y: 532 },
        chest: { x: 788, y: 510 },
        door: { x: 826, y: 112, side: 'top' },
        walls: [
          { x: 42, y: 376, w: 246, h: 30 },
          { x: 330, y: 218, w: 30, h: 212 },
          { x: 420, y: 304, w: 270, h: 30 },
          { x: 648, y: 92, w: 30, h: 146 }
        ],
        minerals: [
          { x: 112, y: 496, color: '#5eead4' },
          { x: 268, y: 462, color: '#facc15' },
          { x: 245, y: 168, color: '#67e8f9' },
          { x: 512, y: 244, color: '#fb7185' },
          { x: 742, y: 262, color: '#c4b5fd' }
        ],
        hazards: [
          { type: 'spinner', x: 216, y: 448, length: 56, speed: 1.45, phase: 0.2 },
          { type: 'slider', x: 448, y: 466, length: 70, angle: 0, axis: 'y', range: 66, speed: 1.3, phase: 0.8 },
          { type: 'spinner', x: 590, y: 212, length: 62, speed: -1.2, phase: 1.1 },
          { type: 'slider', x: 758, y: 370, length: 58, angle: Math.PI / 2, axis: 'x', range: 72, speed: 1.15, phase: 2.4 }
        ]
      },
      {
        name: '압쇄 갱도',
        code: 'MINE 02',
        floor: '#131b19',
        floorAlt: '#192321',
        rock: '#31443f',
        accent: '#63c4a2',
        start: { x: 84, y: 112 },
        chest: { x: 116, y: 522 },
        door: { x: 822, y: 526, side: 'right' },
        walls: [
          { x: 190, y: 84, w: 30, h: 224 },
          { x: 190, y: 278, w: 235, h: 30 },
          { x: 395, y: 278, w: 30, h: 218 },
          { x: 550, y: 112, w: 30, h: 246 },
          { x: 550, y: 328, w: 220, h: 30 }
        ],
        minerals: [
          { x: 112, y: 230, color: '#fde047' },
          { x: 306, y: 184, color: '#5eead4' },
          { x: 300, y: 430, color: '#fda4af' },
          { x: 486, y: 516, color: '#93c5fd' },
          { x: 724, y: 206, color: '#d8b4fe' }
        ],
        hazards: [
          { type: 'slider', x: 300, y: 128, length: 58, angle: Math.PI / 2, axis: 'x', range: 58, speed: 1.55, phase: 0 },
          { type: 'spinner', x: 306, y: 388, length: 68, speed: 1.75, phase: 1.3 },
          { type: 'slider', x: 486, y: 420, length: 64, angle: 0, axis: 'y', range: 62, speed: 1.6, phase: 2.1 },
          { type: 'spinner', x: 684, y: 250, length: 74, speed: -1.55, phase: 0.4, arms: 2 },
          { type: 'slider', x: 700, y: 456, length: 60, angle: Math.PI / 2, axis: 'x', range: 70, speed: 1.4, phase: 2.8 }
        ]
      },
      {
        name: '심층 용광로',
        code: 'MINE 03',
        floor: '#1c1714',
        floorAlt: '#241b17',
        rock: '#493831',
        accent: '#ef6a4d',
        start: { x: 450, y: 538 },
        chest: { x: 790, y: 520 },
        door: { x: 450, y: 102, side: 'top' },
        walls: [
          { x: 54, y: 432, w: 246, h: 30 },
          { x: 600, y: 432, w: 246, h: 30 },
          { x: 260, y: 282, w: 150, h: 30 },
          { x: 490, y: 282, w: 150, h: 30 },
          { x: 150, y: 126, w: 30, h: 166 },
          { x: 720, y: 126, w: 30, h: 166 }
        ],
        minerals: [
          { x: 116, y: 520, color: '#67e8f9' },
          { x: 206, y: 352, color: '#fde047' },
          { x: 450, y: 214, color: '#fda4af' },
          { x: 694, y: 352, color: '#86efac' },
          { x: 800, y: 198, color: '#c4b5fd' }
        ],
        hazards: [
          { type: 'spinner', x: 350, y: 496, length: 68, speed: 1.85, phase: 0, arms: 2 },
          { type: 'spinner', x: 550, y: 496, length: 68, speed: -1.85, phase: 0.5, arms: 2 },
          { type: 'slider', x: 450, y: 364, length: 88, angle: 0, axis: 'x', range: 116, speed: 1.45, phase: 1.2 },
          { type: 'spinner', x: 250, y: 208, length: 72, speed: -1.7, phase: 1.6, arms: 3 },
          { type: 'spinner', x: 650, y: 208, length: 72, speed: 1.7, phase: 0.1, arms: 3 },
          { type: 'slider', x: 450, y: 150, length: 70, angle: Math.PI / 2, axis: 'y', range: 38, speed: 1.9, phase: 2.2 }
        ]
      }
    ];

    let state = 'start';
    let stageIndex = 0;
    let stage = STAGES[0];
    let stageTime = 0;
    let transitionTimer = 0;
    let transitionLoaded = false;
    let lastTime = performance.now();
    let keys = {};
    let minerals = [];
    let particles = [];
    let dust = [];
    let chestOpen = false;
    let hasKey = false;
    let shake = 0;
    let toastTimer = 0;
    let audioContext = null;

    const player = {
      x: 0,
      y: 0,
      angle: 0,
      speed: 178,
      lives: 3,
      jumpTimer: 0,
      jumpCooldown: 0,
      invulnerable: 0,
      moving: false,
      step: 0
    };

    function roundedRectPath(context, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      context.beginPath();
      context.moveTo(x + radius, y);
      context.arcTo(x + w, y, x + w, y + h, radius);
      context.arcTo(x + w, y + h, x, y + h, radius);
      context.arcTo(x, y + h, x, y, radius);
      context.arcTo(x, y, x + w, y, radius);
      context.closePath();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function pointSegmentDistance(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const lengthSquared = dx * dx + dy * dy;
      if (lengthSquared === 0) return distance(px, py, ax, ay);
      const t = clamp(((px - ax) * dx + (py - ay) * dy) / lengthSquared, 0, 1);
      return distance(px, py, ax + dx * t, ay + dy * t);
    }

    function circleHitsRect(x, y, radius, rect) {
      const nearestX = clamp(x, rect.x, rect.x + rect.w);
      const nearestY = clamp(y, rect.y, rect.y + rect.h);
      return distance(x, y, nearestX, nearestY) < radius;
    }

    function createDust() {
      const result = [];
      for (let i = 0; i < 92; i++) {
        const seed = i * 917 + stageIndex * 311;
        result.push({
          x: FLOOR.left + 12 + ((seed * 37) % 824),
          y: FLOOR.top + 12 + ((seed * 71) % 488),
          size: 0.7 + (seed % 17) / 16,
          alpha: 0.08 + (seed % 11) / 90
        });
      }
      return result;
    }

    function setupStage(index) {
      stage = STAGES[index];
      stageTime = 0;
      minerals = stage.minerals.map(function (mineral, mineralIndex) {
        return Object.assign({ collected: false, phase: mineralIndex * 1.37 }, mineral);
      });
      particles = [];
      chestOpen = false;
      hasKey = false;
      player.x = stage.start.x;
      player.y = stage.start.y;
      player.angle = -Math.PI / 2;
      player.jumpTimer = 0;
      player.jumpCooldown = 0;
      player.invulnerable = 0.7;
      player.moving = false;
      dust = createDust();
      showMessage(stage.name + ' 진입', stage.accent, 1.8);
    }

    function startGame() {
      initAudio();
      stageIndex = 0;
      player.lives = 3;
      setupStage(stageIndex);
      state = 'playing';
      overlay.classList.remove('active');
      lastTime = performance.now();
      tone(220, 0.08, 'square', 0.035);
      setTimeout(function () { tone(330, 0.12, 'square', 0.025); }, 80);
    }

    function showEndOverlay(kind) {
      if (kind === 'win') {
        overlayKicker.textContent = 'SURFACE SIGNAL RESTORED';
        overlayTitle.textContent = '탈출 성공';
        overlayRoute.innerHTML = '<b>3개 스테이지 완료</b> · 광부 귀환';
        startButton.textContent = '다시 내려가기';
      } else {
        overlayKicker.textContent = stage.code + ' // SIGNAL LOST';
        overlayTitle.textContent = '탐사 실패';
        overlayRoute.innerHTML = '<b>가시봉에 접촉했습니다</b> · 장비 재정비';
        startButton.textContent = '처음부터 재도전';
      }
      overlay.classList.add('active');
    }

    function initAudio() {
      if (audioContext) {
        if (audioContext.state === 'suspended') audioContext.resume();
        return;
      }
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (AudioCtor) audioContext = new AudioCtor();
    }

    function tone(frequency, duration, type, volume, slide) {
      if (!audioContext) return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;
      oscillator.type = type || 'sine';
      oscillator.frequency.setValueAtTime(frequency, now);
      if (slide) oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, slide), now + duration);
      gain.gain.setValueAtTime(volume || 0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration);
    }

    function showMessage(text, color, duration) {
      toast.textContent = text;
      toast.style.borderColor = color || '#68736d';
      toast.style.color = color || '#f4efe4';
      toast.classList.add('show');
      toastTimer = duration || 1.4;
    }

    function getJumpHeight() {
      if (player.jumpTimer <= 0) return 0;
      const progress = 1 - player.jumpTimer / JUMP_DURATION;
      return Math.sin(progress * Math.PI);
    }

    function tryJump() {
      if (state !== 'playing' || player.jumpCooldown > 0 || player.jumpTimer > 0) return;
      player.jumpTimer = JUMP_DURATION;
      player.jumpCooldown = 0.86;
      tone(150, 0.13, 'triangle', 0.025, 310);
    }

    function collidesWithWall(x, y, radius) {
      if (x - radius < FLOOR.left || x + radius > FLOOR.right ||
          y - radius < FLOOR.top || y + radius > FLOOR.bottom) return true;
      return stage.walls.some(function (wall) {
        return circleHitsRect(x, y, radius, wall);
      });
    }

    function movePlayer(dx, dy) {
      const nextX = player.x + dx;
      if (!collidesWithWall(nextX, player.y, PLAYER_RADIUS)) player.x = nextX;
      const nextY = player.y + dy;
      if (!collidesWithWall(player.x, nextY, PLAYER_RADIUS)) player.y = nextY;
    }

    function getHazardSegments(hazard) {
      let x = hazard.x;
      let y = hazard.y;
      let angle = hazard.angle || 0;
      const segments = [];

      if (hazard.type === 'slider') {
        const offset = Math.sin(stageTime * hazard.speed + hazard.phase) * hazard.range;
        if (hazard.axis === 'x') x += offset;
        else y += offset;
      } else {
        angle = stageTime * hazard.speed + hazard.phase;
      }

      const arms = hazard.arms || 1;
      for (let arm = 0; arm < arms; arm++) {
        const armAngle = angle + arm * Math.PI / arms;
        const cos = Math.cos(armAngle);
        const sin = Math.sin(armAngle);
        segments.push({
          ax: x - cos * hazard.length,
          ay: y - sin * hazard.length,
          bx: x + cos * hazard.length,
          by: y + sin * hazard.length,
          x: x,
          y: y,
          angle: armAngle
        });
      }
      return segments;
    }

    function updatePlayer(dt) {
      let dx = 0;
      let dy = 0;
      if (keys.ArrowLeft || keys.KeyA) dx -= 1;
      if (keys.ArrowRight || keys.KeyD) dx += 1;
      if (keys.ArrowUp || keys.KeyW) dy -= 1;
      if (keys.ArrowDown || keys.KeyS) dy += 1;

      const length = Math.hypot(dx, dy);
      player.moving = length > 0;
      if (length > 0) {
        dx /= length;
        dy /= length;
        player.angle = Math.atan2(dy, dx);
        const speedBoost = getJumpHeight() > 0.15 ? 1.08 : 1;
        movePlayer(dx * player.speed * speedBoost * dt, dy * player.speed * speedBoost * dt);
        player.step += dt * 12;
      }

      if (player.jumpTimer > 0) player.jumpTimer = Math.max(0, player.jumpTimer - dt);
      if (player.jumpCooldown > 0) player.jumpCooldown = Math.max(0, player.jumpCooldown - dt);
      if (player.invulnerable > 0) player.invulnerable = Math.max(0, player.invulnerable - dt);
    }

    function updateHazards() {
      if (player.invulnerable > 0 || getJumpHeight() > 0.23) return;
      for (const hazard of stage.hazards) {
        const segments = getHazardSegments(hazard);
        for (const segment of segments) {
          if (pointSegmentDistance(player.x, player.y, segment.ax, segment.ay, segment.bx, segment.by) < PLAYER_RADIUS + 9) {
            hitPlayer(segment.x, segment.y);
            return;
          }
        }
      }
    }

    function hitPlayer(sourceX, sourceY) {
      player.lives -= 1;
      player.invulnerable = 1.6;
      shake = 12;
      const angle = Math.atan2(player.y - sourceY, player.x - sourceX);
      movePlayer(Math.cos(angle) * 25, Math.sin(angle) * 25);
      burst(player.x, player.y, '#ff6b57', 18, 125);
      tone(120, 0.28, 'sawtooth', 0.05, 48);

      if (player.lives <= 0) {
        state = 'gameover';
        showEndOverlay('gameover');
      } else {
        showMessage('보호 장비 손상 · ' + player.lives + '칸 남음', '#ff806f', 1.5);
      }
    }

    function updateObjectives() {
      for (const mineral of minerals) {
        if (!mineral.collected && distance(player.x, player.y, mineral.x, mineral.y) < PLAYER_RADIUS + 14) {
          mineral.collected = true;
          const count = minerals.filter(function (item) { return item.collected; }).length;
          burst(mineral.x, mineral.y, mineral.color, 16, 92);
          tone(360 + count * 70, 0.13, 'sine', 0.045, 520 + count * 60);
          if (count === TOTAL_MINERALS) {
            showMessage('광물 확보 완료 · 열쇠함 활성화', '#6ee7b7', 2);
          } else {
            showMessage('광물 ' + count + ' / ' + TOTAL_MINERALS, mineral.color, 1.1);
          }
        }
      }

      const collected = minerals.filter(function (item) { return item.collected; }).length;
      if (collected === TOTAL_MINERALS && !chestOpen &&
          distance(player.x, player.y, stage.chest.x, stage.chest.y) < 42) {
        chestOpen = true;
        hasKey = true;
        burst(stage.chest.x, stage.chest.y, '#f7b955', 28, 130);
        tone(260, 0.12, 'square', 0.04, 420);
        setTimeout(function () { tone(520, 0.2, 'triangle', 0.035, 760); }, 90);
        showMessage('탈출 열쇠 획득', '#f7c86d', 1.8);
      }

      if (hasKey && distance(player.x, player.y, stage.door.x, stage.door.y) < 45) {
        hasKey = false;
        burst(stage.door.x, stage.door.y, stage.accent, 30, 160);
        tone(170, 0.35, 'square', 0.04, 70);
        if (stageIndex === STAGES.length - 1) {
          state = 'win';
          showEndOverlay('win');
        } else {
          state = 'transition';
          transitionTimer = 1.5;
          transitionLoaded = false;
        }
      }
    }

    function burst(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = speed * (0.3 + Math.random() * 0.7);
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          life: 0.45 + Math.random() * 0.45,
          maxLife: 0.9,
          size: 1.5 + Math.random() * 3.5,
          color: color
        });
      }
    }

    function updateParticles(dt) {
      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= Math.pow(0.03, dt);
        particle.vy *= Math.pow(0.03, dt);
        particle.life -= dt;
      }
      particles = particles.filter(function (particle) { return particle.life > 0; });
    }

    function update(dt) {
      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toast.classList.remove('show');
      }

      updateParticles(dt);
      if (state === 'playing') {
        stageTime += dt;
        updatePlayer(dt);
        updateHazards();
        if (state === 'playing') updateObjectives();
      } else if (state === 'transition') {
        transitionTimer -= dt;
        if (transitionTimer < 0.78 && !transitionLoaded) {
          stageIndex += 1;
          setupStage(stageIndex);
          transitionLoaded = true;
        }
        if (transitionTimer <= 0) state = 'playing';
      }

      shake *= Math.pow(0.015, dt);
    }

    function drawFloor() {
      ctx.fillStyle = '#080b09';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = stage.floor;
      ctx.fillRect(FLOOR.left, FLOOR.top, FLOOR.right - FLOOR.left, FLOOR.bottom - FLOOR.top);

      const tile = 46;
      for (let y = FLOOR.top; y < FLOOR.bottom; y += tile) {
        for (let x = FLOOR.left; x < FLOOR.right; x += tile) {
          const even = ((x / tile + y / tile) | 0) % 2 === 0;
          ctx.fillStyle = even ? stage.floorAlt : stage.floor;
          ctx.globalAlpha = 0.34;
          ctx.fillRect(x + 1, y + 1, tile - 2, tile - 2);
        }
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = 'rgba(212, 222, 214, 0.035)';
      ctx.lineWidth = 1;
      for (let x = 56; x < WIDTH; x += 92) {
        ctx.beginPath();
        ctx.moveTo(x, FLOOR.top);
        ctx.lineTo(x - 18, FLOOR.bottom);
        ctx.stroke();
      }

      for (const speck of dust) {
        ctx.fillStyle = 'rgba(220, 230, 220,' + speck.alpha + ')';
        ctx.fillRect(speck.x, speck.y, speck.size, speck.size);
      }

      drawCaveBorder();
      drawTrackLines();
    }

    function drawCaveBorder() {
      ctx.save();
      ctx.fillStyle = '#090c0a';
      ctx.strokeStyle = stage.rock;
      ctx.lineWidth = 10;
      ctx.strokeRect(FLOOR.left - 5, FLOOR.top - 5, FLOOR.right - FLOOR.left + 10, FLOOR.bottom - FLOOR.top + 10);

      for (let x = FLOOR.left + 8; x < FLOOR.right; x += 32) {
        const wobble = ((x * 13 + stageIndex * 17) % 11) - 5;
        ctx.fillStyle = x % 64 ? stage.rock : '#263029';
        ctx.beginPath();
        ctx.arc(x, FLOOR.top + wobble, 9 + (x % 7), 0, Math.PI * 2);
        ctx.arc(x - 4, FLOOR.bottom - wobble, 8 + (x % 6), 0, Math.PI * 2);
        ctx.fill();
      }
      for (let y = FLOOR.top + 18; y < FLOOR.bottom; y += 34) {
        const wobble = ((y * 7 + stageIndex * 19) % 9) - 4;
        ctx.fillStyle = y % 68 ? stage.rock : '#263029';
        ctx.beginPath();
        ctx.arc(FLOOR.left + wobble, y, 9 + (y % 6), 0, Math.PI * 2);
        ctx.arc(FLOOR.right - wobble, y, 8 + (y % 7), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTrackLines() {
      ctx.save();
      ctx.strokeStyle = 'rgba(129, 108, 76, 0.22)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(FLOOR.left + 18, FLOOR.bottom - 54);
      ctx.bezierCurveTo(250, 460, 610, 520, FLOOR.right - 18, FLOOR.top + 70);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawWalls() {
      for (const wall of stage.walls) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
        roundedRectPath(ctx, wall.x + 5, wall.y + 7, wall.w, wall.h, 5);
        ctx.fill();

        const gradient = ctx.createLinearGradient(wall.x, wall.y, wall.x, wall.y + wall.h);
        gradient.addColorStop(0, '#566259');
        gradient.addColorStop(0.28, stage.rock);
        gradient.addColorStop(1, '#222a24');
        ctx.fillStyle = gradient;
        roundedRectPath(ctx, wall.x, wall.y, wall.w, wall.h, 5);
        ctx.fill();
        ctx.strokeStyle = 'rgba(196, 210, 201, 0.24)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#171c18';
        const horizontal = wall.w > wall.h;
        const count = Math.floor((horizontal ? wall.w : wall.h) / 26);
        for (let i = 1; i < count; i++) {
          if (horizontal) ctx.fillRect(wall.x + i * 26, wall.y + 4, 3, wall.h - 8);
          else ctx.fillRect(wall.x + 4, wall.y + i * 26, wall.w - 8, 3);
        }
      }
    }

    function drawMinerals() {
      for (const mineral of minerals) {
        if (mineral.collected) continue;
        const pulse = 1 + Math.sin(stageTime * 3.2 + mineral.phase) * 0.08;
        ctx.save();
        ctx.translate(mineral.x, mineral.y);
        ctx.scale(pulse, pulse);
        ctx.shadowBlur = 18;
        ctx.shadowColor = mineral.color;
        ctx.fillStyle = mineral.color;
        ctx.beginPath();
        ctx.moveTo(0, -13);
        ctx.lineTo(10, -4);
        ctx.lineTo(7, 10);
        ctx.lineTo(-6, 12);
        ctx.lineTo(-11, -2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.62)';
        ctx.beginPath();
        ctx.moveTo(-1, -9);
        ctx.lineTo(6, -3);
        ctx.lineTo(2, 1);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(3, 7, 5, 0.48)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawChest() {
      const collected = minerals.filter(function (item) { return item.collected; }).length;
      const ready = collected === TOTAL_MINERALS;
      const x = stage.chest.x;
      const y = stage.chest.y;
      ctx.save();
      ctx.translate(x, y);

      if (ready && !chestOpen) {
        ctx.shadowBlur = 22 + Math.sin(stageTime * 4) * 6;
        ctx.shadowColor = '#f7b955';
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(-24, 15, 48, 9);
      ctx.fillStyle = chestOpen ? '#4b3c23' : '#7a5726';
      roundedRectPath(ctx, -23, -8, 46, 29, 4);
      ctx.fill();
      ctx.strokeStyle = '#d29a43';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#29231a';
      ctx.fillRect(-23, 1, 46, 5);
      ctx.fillStyle = ready ? '#ffd778' : '#6f776f';
      ctx.fillRect(-4, 4, 8, 10);

      if (chestOpen) {
        ctx.save();
        ctx.translate(0, -10);
        ctx.rotate(-0.38);
        ctx.fillStyle = '#694b23';
        roundedRectPath(ctx, -23, -15, 46, 14, 4);
        ctx.fill();
        ctx.strokeStyle = '#d29a43';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      } else {
        ctx.fillStyle = '#694b23';
        roundedRectPath(ctx, -23, -18, 46, 14, 4);
        ctx.fill();
        ctx.strokeStyle = '#d29a43';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawDoor() {
      const x = stage.door.x;
      const y = stage.door.y;
      const unlocked = hasKey;
      ctx.save();
      ctx.translate(x, y);

      if (unlocked) {
        ctx.shadowBlur = 26 + Math.sin(stageTime * 5) * 5;
        ctx.shadowColor = stage.accent;
      }

      ctx.fillStyle = '#0b0f0c';
      roundedRectPath(ctx, -28, -31, 56, 62, 5);
      ctx.fill();
      ctx.strokeStyle = unlocked ? stage.accent : '#5e6861';
      ctx.lineWidth = 5;
      ctx.stroke();

      const doorGradient = ctx.createLinearGradient(-20, 0, 20, 0);
      doorGradient.addColorStop(0, '#1b231e');
      doorGradient.addColorStop(0.5, '#3b4740');
      doorGradient.addColorStop(1, '#18201b');
      ctx.fillStyle = doorGradient;
      ctx.fillRect(-20, -24, 40, 50);
      ctx.strokeStyle = '#65716a';
      ctx.lineWidth = 2;
      ctx.strokeRect(-20, -24, 40, 50);

      ctx.fillStyle = unlocked ? '#7ef0bf' : '#db5c4d';
      ctx.beginPath();
      ctx.arc(10, 2, 4, 0, Math.PI * 2);
      ctx.fill();

      if (!unlocked) {
        ctx.strokeStyle = '#8d9690';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, -2, 8, Math.PI, 0);
        ctx.stroke();
        ctx.fillStyle = '#6a746e';
        roundedRectPath(ctx, -10, -2, 20, 17, 3);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHazardTrack(hazard) {
      if (hazard.type !== 'slider') return;
      ctx.save();
      ctx.strokeStyle = 'rgba(207, 216, 210, 0.12)';
      ctx.lineWidth = 3;
      ctx.setLineDash([5, 7]);
      ctx.beginPath();
      if (hazard.axis === 'x') {
        ctx.moveTo(hazard.x - hazard.range, hazard.y);
        ctx.lineTo(hazard.x + hazard.range, hazard.y);
      } else {
        ctx.moveTo(hazard.x, hazard.y - hazard.range);
        ctx.lineTo(hazard.x, hazard.y + hazard.range);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawHazards() {
      for (const hazard of stage.hazards) drawHazardTrack(hazard);

      for (const hazard of stage.hazards) {
        const segments = getHazardSegments(hazard);
        for (const segment of segments) drawSpikedBar(segment);
        const hub = segments[0];
        ctx.save();
        ctx.translate(hub.x, hub.y);
        ctx.fillStyle = '#171b18';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#98a29c';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = stage.accent;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawSpikedBar(segment) {
      const dx = segment.bx - segment.ax;
      const dy = segment.by - segment.ay;
      const length = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(segment.x, segment.y);
      ctx.rotate(angle);

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.lineWidth = 19;
      ctx.beginPath();
      ctx.moveTo(-length / 2 + 5, 6);
      ctx.lineTo(length / 2 - 5, 6);
      ctx.stroke();

      const metal = ctx.createLinearGradient(0, -8, 0, 8);
      metal.addColorStop(0, '#d8dfda');
      metal.addColorStop(0.35, '#738078');
      metal.addColorStop(0.7, '#3f4943');
      metal.addColorStop(1, '#9aa59e');
      ctx.strokeStyle = metal;
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-length / 2 + 7, 0);
      ctx.lineTo(length / 2 - 7, 0);
      ctx.stroke();

      ctx.fillStyle = '#cbd3ce';
      ctx.strokeStyle = '#3a423d';
      ctx.lineWidth = 1.5;
      for (let x = -length / 2 + 15; x < length / 2 - 8; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x - 6, -5);
        ctx.lineTo(x, -17);
        ctx.lineTo(x + 6, -5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 6, 5);
        ctx.lineTo(x, 17);
        ctx.lineTo(x + 6, 5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.save();
        ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.fillStyle = particle.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawMiner() {
      const jumpHeight = getJumpHeight();
      const scale = 1 + jumpHeight * 0.48;
      const bob = player.moving && jumpHeight === 0 ? Math.sin(player.step) * 1.2 : 0;
      const blink = player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0;

      ctx.save();
      ctx.translate(player.x, player.y + 8);
      ctx.scale(1 - jumpHeight * 0.25, 1 - jumpHeight * 0.25);
      ctx.globalAlpha = 0.42 - jumpHeight * 0.18;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (blink) return;

      ctx.save();
      ctx.translate(player.x, player.y - jumpHeight * 12 + bob);
      ctx.rotate(player.angle + Math.PI / 2);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#252b27';
      roundedRectPath(ctx, -16, -3, 32, 28, 7);
      ctx.fill();
      ctx.strokeStyle = '#0b0e0c';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#d29c3e';
      roundedRectPath(ctx, -14, -8, 28, 28, 7);
      ctx.fill();
      ctx.strokeStyle = '#5e4823';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#303833';
      roundedRectPath(ctx, -20, -2, 7, 19, 3);
      ctx.fill();
      roundedRectPath(ctx, 13, -2, 7, 19, 3);
      ctx.fill();

      ctx.fillStyle = '#1a211d';
      roundedRectPath(ctx, -13, 14, 10, 13, 3);
      ctx.fill();
      roundedRectPath(ctx, 3, 14, 10, 13, 3);
      ctx.fill();

      ctx.fillStyle = '#59635d';
      ctx.beginPath();
      ctx.arc(0, -10, 19, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d5a847';
      ctx.lineWidth = 5;
      ctx.stroke();

      const visor = ctx.createLinearGradient(-12, -21, 10, 2);
      visor.addColorStop(0, '#d6fff2');
      visor.addColorStop(0.16, '#79aa9a');
      visor.addColorStop(0.5, '#29473e');
      visor.addColorStop(1, '#101b17');
      ctx.fillStyle = visor;
      ctx.beginPath();
      ctx.ellipse(0, -10, 13, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#171d1a';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.62)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-3, -13, 7, 3.5, 4.8);
      ctx.stroke();

      ctx.fillStyle = '#f7c85b';
      roundedRectPath(ctx, -8, -31, 16, 7, 2);
      ctx.fill();
      ctx.shadowBlur = 13;
      ctx.shadowColor = '#ffe5a3';
      ctx.fillStyle = '#fff1bd';
      ctx.fillRect(-5, -30, 10, 4);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#b53f31';
      ctx.fillRect(-11, 7, 22, 4);
      ctx.fillStyle = '#e0b152';
      ctx.fillRect(-3, 8, 6, 6);
      ctx.restore();
    }

    function drawDarkness() {
      const jumpHeight = getJumpHeight();
      const radius = 154 + jumpHeight * 18;
      const gradient = ctx.createRadialGradient(player.x, player.y, 34, player.x, player.y, radius);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      gradient.addColorStop(0.36, 'rgba(0, 0, 0, 0.06)');
      gradient.addColorStop(0.72, 'rgba(0, 0, 0, 0.68)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0.965)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, HUD_HEIGHT, WIDTH, HEIGHT - HUD_HEIGHT);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const lampX = player.x + Math.cos(player.angle) * 42;
      const lampY = player.y + Math.sin(player.angle) * 42;
      const lamp = ctx.createRadialGradient(lampX, lampY, 0, lampX, lampY, 65);
      lamp.addColorStop(0, 'rgba(255, 226, 153, 0.18)');
      lamp.addColorStop(1, 'rgba(255, 226, 153, 0)');
      ctx.fillStyle = lamp;
      ctx.beginPath();
      ctx.arc(lampX, lampY, 65, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHud() {
      const collected = minerals.filter(function (item) { return item.collected; }).length;
      const hpColors = ['#ff6758', '#ff9b55', '#73db9f'];
      ctx.save();
      ctx.fillStyle = 'rgba(7, 10, 8, 0.97)';
      ctx.fillRect(0, 0, WIDTH, HUD_HEIGHT);
      ctx.strokeStyle = '#303a34';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, HUD_HEIGHT - 0.5);
      ctx.lineTo(WIDTH, HUD_HEIGHT - 0.5);
      ctx.stroke();

      ctx.fillStyle = stage.accent;
      ctx.font = '800 11px Arial';
      ctx.fillText(stage.code + ' / 03', 28, 24);
      ctx.fillStyle = '#f3efe6';
      ctx.font = '800 19px Arial';
      ctx.fillText(stage.name, 28, 48);

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      ctx.fillText('광물', 258, 23);
      for (let i = 0; i < TOTAL_MINERALS; i++) {
        const x = 270 + i * 27;
        ctx.save();
        ctx.translate(x, 43);
        ctx.fillStyle = i < collected ? minerals[i].color : '#29312c';
        ctx.strokeStyle = i < collected ? '#d8fff2' : '#566059';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.lineTo(8, -2);
        ctx.lineTo(5, 8);
        ctx.lineTo(-6, 8);
        ctx.lineTo(-8, -2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      ctx.fillText('열쇠', 446, 23);
      drawKeyIcon(472, 43, hasKey || chestOpen);

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      ctx.fillText('장비', 640, 23);
      for (let i = 0; i < 3; i++) {
        const x = 670 + i * 34;
        ctx.fillStyle = i < player.lives ? hpColors[player.lives - 1] : '#262d29';
        ctx.strokeStyle = i < player.lives ? '#ffd6cf' : '#4b554f';
        ctx.lineWidth = 1;
        roundedRectPath(ctx, x, 34, 25, 16, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = i < player.lives ? 'rgba(255,255,255,0.34)' : 'transparent';
        ctx.fillRect(x + 4, 37, 10, 3);
      }

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      const objective = collected < TOTAL_MINERALS ? '광물 탐색' : (!chestOpen ? '열쇠함 이동' : '탈출문 이동');
      ctx.textAlign = 'right';
      ctx.fillText(objective, 870, 25);
      ctx.fillStyle = collected < TOTAL_MINERALS ? '#e8ece9' : stage.accent;
      ctx.font = '800 14px Arial';
      ctx.fillText(collected < TOTAL_MINERALS ? collected + ' / 5' : (chestOpen ? 'UNLOCKED' : 'READY'), 870, 47);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    function drawKeyIcon(x, y, active) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = active ? '#f7c85b' : '#424b46';
      ctx.fillStyle = active ? '#f7c85b' : '#424b46';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(-8, 0, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-1, 0);
      ctx.lineTo(15, 0);
      ctx.lineTo(15, 7);
      ctx.moveTo(8, 0);
      ctx.lineTo(8, 6);
      ctx.stroke();
      if (active) {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#f7c85b';
        ctx.beginPath();
        ctx.arc(-8, 0, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTransition() {
      if (state !== 'transition') return;
      const progress = Math.abs(transitionTimer - 0.75) / 0.75;
      const alpha = 1 - clamp(progress, 0, 1);
      ctx.save();
      ctx.fillStyle = 'rgba(3, 5, 4,' + alpha + ')';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = stage.accent;
      ctx.textAlign = 'center';
      ctx.font = '800 12px Arial';
      ctx.fillText('DESCENDING', WIDTH / 2, HEIGHT / 2 - 18);
      ctx.fillStyle = '#f5f0e5';
      ctx.font = '800 32px Arial';
      ctx.fillText(stage.name, WIDTH / 2, HEIGHT / 2 + 20);
      ctx.restore();
    }

    function draw() {
      ctx.save();
      if (shake > 0.3) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      drawFloor();
      drawWalls();
      drawChest();
      drawDoor();
      drawMinerals();
      drawHazards();
      drawParticles();
      drawMiner();
      drawDarkness();
      ctx.restore();
      drawHud();
      drawTransition();
    }

    function loop(now) {
      const dt = Math.min(0.034, Math.max(0, (now - lastTime) / 1000));
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', function (event) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) {
        event.preventDefault();
      }
      keys[event.code] = true;
      if (event.code === 'Space' && !event.repeat) {
        if (state === 'start' || state === 'gameover' || state === 'win') startGame();
        else tryJump();
      }
      if (event.code === 'Enter' && state !== 'playing' && state !== 'transition') startGame();
    });

    window.addEventListener('keyup', function (event) {
      keys[event.code] = false;
    });

    window.addEventListener('blur', function () {
      keys = {};
    });

    startButton.addEventListener('click', startGame);

    if (window.MobileArcade) {
      window.MobileArcade.dpad({
        up: 'up',
        down: 'down',
        left: 'left',
        right: 'right'
      }, { side: 'left', tag: 'MOVE' });
      window.MobileArcade.actions([
        { label: 'JUMP', key: 'space' }
      ], { side: 'right', bottom: '42px' });
    }

    setupStage(0);
    toast.classList.remove('show');
    requestAnimationFrame(loop);
  </script>
</body>

</html>
