<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>광산 탈출 - Mine Escape</title>
  <style>
    :root {
      --ink: #070908;
      --coal: #101512;
      --iron: #68736d;
      --amber: #f7b955;
      --mint: #6ee7b7;
      --danger: #ff5b4d;
      --paper: #f4efe4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050706;
    }

    body {
      color: var(--paper);
      font-family: "Arial Narrow", "Noto Sans KR", Arial, sans-serif;
      background: #050706;
    }

    .back-button {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 20;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #eef2ee;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(7, 10, 8, 0.78);
      backdrop-filter: blur(8px);
      font-size: 22px;
      line-height: 1;
    }

    .back-button:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    #game-shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0a0d0b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 28px;
      background: rgba(4, 7, 5, 0.88);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .helmet-mark {
      width: 112px;
      height: 112px;
      margin-bottom: 18px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.72)) drop-shadow(0 0 16px rgba(247, 185, 85, 0.2));
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--amber);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      color: #fff8e8;
      font-size: clamp(42px, 8vw, 68px);
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 6px 32px rgba(0, 0, 0, 0.8);
    }

    .mission-route {
      margin: 18px 0 24px;
      color: #b8c2bc;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .mission-route b {
      color: var(--mint);
    }

    .start-button {
      min-width: 170px;
      height: 48px;
      border: 1px solid #fbd17f;
      border-radius: 6px;
      color: #191306;
      background: var(--amber);
      font: 800 16px inherit;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(247, 185, 85, 0.18);
    }

    .start-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .start-button:disabled {
      cursor: wait;
      filter: grayscale(0.45) brightness(0.72);
      transform: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      color: #87918b;
      font-size: 11px;
      font-weight: 700;
    }

    .key {
      display: inline-grid;
      min-width: 28px;
      height: 24px;
      place-items: center;
      padding: 0 6px;
      margin-right: 4px;
      color: #dce4df;
      border: 1px solid #56615b;
      border-radius: 4px;
      background: #1a201c;
      box-shadow: inset 0 -2px 0 #0b0e0c;
    }

    #toast {
      position: absolute;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 7;
      min-width: 260px;
      max-width: calc(100% - 40px);
      padding: 10px 16px;
      color: #f8f2e6;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 5px;
      background: rgba(8, 12, 9, 0.86);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 700px) {
      .back-button {
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
      }

      .controls {
        display: none;
      }

      #toast {
        top: max(82px, calc(env(safe-area-inset-top) + 72px));
        bottom: auto;
      }
    }
  </style>
</head>

    function roundedRectPath(context, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      context.beginPath();
      context.moveTo(x + radius, y);
      context.arcTo(x + w, y, x + w, y + h, radius);
      context.arcTo(x + w, y + h, x, y + h, radius);
      context.arcTo(x, y + h, x, y, radius);
      context.arcTo(x, y, x + w, y, radius);
      context.closePath();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function pointSegmentDistance(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const lengthSquared = dx * dx + dy * dy;
      if (lengthSquared === 0) return distance(px, py, ax, ay);
      const t = clamp(((px - ax) * dx + (py - ay) * dy) / lengthSquared, 0, 1);
      return distance(px, py, ax + dx * t, ay + dy * t);
    }

    function circleHitsRect(x, y, radius, rect) {
      const nearestX = clamp(x, rect.x, rect.x + rect.w);
      const nearestY = clamp(y, rect.y, rect.y + rect.h);
      return distance(x, y, nearestX, nearestY) < radius;
    }

    function drawSprite(name, x, y, width, height, options) {
      const image = SPRITES[name];
      if (!image || !image.complete || !image.naturalWidth) return false;
      const settings = options || {};
      ctx.save();
      ctx.translate(x, y);
      if (settings.rotation) ctx.rotate(settings.rotation);
      ctx.globalAlpha = settings.alpha === undefined ? 1 : settings.alpha;
      ctx.filter = settings.filter || 'none';
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(image, -width / 2, -height / 2, width, height);
      ctx.restore();
      return true;
    }

    function drawMineralSprite(mineral, x, y, size, active) {
      const enabled = active !== false;
      const filter = enabled
        ? 'drop-shadow(0 0 7px ' + mineral.color + ')'
        : 'grayscale(1) brightness(0.18) contrast(0.82)';
      return drawSprite(mineral.sprite, x, y, size * 0.82, size, {
        alpha: enabled ? 1 : 0.26,
        filter: filter
      });
    }

          alpha: 0.08 + (seed % 11) / 90

      }
      return result;

    function initAudio() {
      if (audioContext) {
        if (audioContext.state === 'suspended') audioContext.resume();
        return;
      }
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;

      audioContext = new AudioCtor();
      masterGain = audioContext.createGain();
      musicGain = audioContext.createGain();
      sfxGain = audioContext.createGain();
      masterGain.gain.value = 0.72;
      musicGain.gain.value = 0.16;
      sfxGain.gain.value = 0.62;
      musicGain.connect(masterGain);
      sfxGain.connect(masterGain);
      masterGain.connect(audioContext.destination);
    }

    function scheduleTone(frequency, startTime, duration, type, volume, output, slide) {
      if (!audioContext || !output) return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type || 'sine';
      oscillator.frequency.setValueAtTime(frequency, startTime);
      if (slide) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, slide), startTime + duration);
      }
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume || 0.03, startTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      oscillator.connect(gain);
      gain.connect(output);
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.02);
    }

    function tone(frequency, duration, type, volume, slide, delay) {
      if (!audioContext || !sfxGain) return;
      scheduleTone(
        frequency,
        audioContext.currentTime + (delay || 0),
        duration,
        type,
        volume,
        sfxGain,
        slide
      );
    }

    function startMusic() {
      if (!audioContext || !musicGain) return;
      if (musicTimer) clearInterval(musicTimer);
      const now = audioContext.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(0.0001, now);
      musicGain.gain.linearRampToValueAtTime(0.16, now + 1.1);
      musicStep = 0;
      musicNextTime = now + 0.08;
      scheduleMusic();
      musicTimer = setInterval(scheduleMusic, 180);
    }

    function stopMusic(fadeDuration) {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
      if (!audioContext || !musicGain) return;
      const now = audioContext.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(Math.max(0.0001, musicGain.gain.value), now);
      musicGain.gain.exponentialRampToValueAtTime(0.0001, now + (fadeDuration || 0.45));
    }

    function scheduleMusic() {
      if (!audioContext || !musicGain || state === 'gameover' || state === 'win') return;
      const horizon = audioContext.currentTime + 0.8;
      const beatDuration = Math.max(0.27, 0.38 - stageIndex * 0.012);

      while (musicNextTime < horizon) {
        const music = MUSIC_STAGES[stageIndex] || MUSIC_STAGES[0];
        const sequenceStep = musicStep % music.notes.length;
        const semitone = music.notes[sequenceStep];
        const melodyFrequency = music.root * 2 * Math.pow(2, semitone / 12);

        if (musicStep % 4 === 0) {
          scheduleTone(music.root, musicNextTime, 1.35, 'triangle', 0.055, musicGain, music.root * 0.98);
          scheduleTone(music.root / 2, musicNextTime, 1.5, 'sine', 0.045, musicGain);
        }
        if (sequenceStep !== 1 && sequenceStep !== 5) {
          scheduleTone(melodyFrequency, musicNextTime, 0.42, 'sine', 0.027, musicGain, melodyFrequency * 0.995);
        }
        if (musicStep % 4 === 2) {
          scheduleTone(1280 + stageIndex * 170, musicNextTime, 0.055, 'square', 0.009, musicGain, 720);
        }

        musicNextTime += beatDuration;
        musicStep += 1;
      }
    }

      tone(root * 1.5, 0.24, 'sine', 0.038, root * 2, 0.13);
      tone(root * 2, 0.38, 'sine', 0.032, null, 0.28);

      tone(base, 0.12, 'sine', 0.05, base * 1.25, 0);
      tone(base * 1.5, 0.16, 'sine', 0.038, base * 1.8, 0.07);
      if (count === TOTAL_MINERALS) tone(base * 2, 0.36, 'triangle', 0.04, null, 0.17);
    }

    function playChestSfx() {
      tone(118, 0.16, 'square', 0.038, 210, 0);
      tone(245, 0.11, 'triangle', 0.035, 390, 0.09);
      tone(620, 0.34, 'sine', 0.042, 880, 0.18);
    }

    function playDoorSfx(finalDoor) {
      tone(142, 0.42, 'sawtooth', 0.045, 48, 0);
      tone(196, 0.32, 'triangle', 0.032, 98, 0.12);
      if (finalDoor) {
        tone(392, 0.5, 'sine', 0.04, 784, 0.28);
        tone(587.33, 0.7, 'sine', 0.035, 1174.66, 0.42);
      }
    }

    function playHitSfx() {
      tone(126, 0.3, 'sawtooth', 0.06, 46, 0);
      tone(68, 0.2, 'square', 0.035, 42, 0.04);
    }

    function playRepairSfx() {
      tone(196, 0.12, 'triangle', 0.04, 294, 0);
      tone(392, 0.18, 'sine', 0.042, 523.25, 0.08);
      tone(659.25, 0.3, 'sine', 0.035, 783.99, 0.18);
    }

    function showMessage(text, color, duration) {
      toast.textContent = text;
      toast.style.borderColor = color || '#68736d';
      toast.style.color = color || '#f4efe4';
      toast.classList.add('show');
      toastTimer = duration || 1.4;
    }

    function getJumpHeight() {
      if (player.jumpTimer <= 0) return 0;
      const progress = 1 - player.jumpTimer / JUMP_DURATION;
      return Math.sin(progress * Math.PI);
    }

    function tryJump() {
      if (state !== 'playing' || player.jumpCooldown > 0 || player.jumpTimer > 0) return;
      player.jumpTimer = JUMP_DURATION;
      player.jumpCooldown = 0.86;
      tone(150, 0.13, 'triangle', 0.025, 310);
    }

    function collidesWithWall(x, y, radius) {
      if (x - radius < FLOOR.left || x + radius > FLOOR.right ||
          y - radius < FLOOR.top || y + radius > FLOOR.bottom) return true;
      return stage.walls.some(function (wall) {
        return circleHitsRect(x, y, radius, wall);
      });
    }

    function movePlayer(dx, dy) {
      const nextX = player.x + dx;
      if (!collidesWithWall(nextX, player.y, PLAYER_RADIUS)) player.x = nextX;
      const nextY = player.y + dy;
      if (!collidesWithWall(player.x, nextY, PLAYER_RADIUS)) player.y = nextY;
    }

    function getHazardSegments(hazard) {
      let x = hazard.x;
      let y = hazard.y;
      let angle = hazard.angle || 0;
      const segments = [];

      if (hazard.type === 'slider') {
        const offset = Math.sin(stageTime * hazard.speed + hazard.phase) * hazard.range;
        if (hazard.axis === 'x') x += offset;
        else y += offset;
      } else {
        angle = stageTime * hazard.speed + hazard.phase;
      }

      const arms = hazard.arms || 1;
      for (let arm = 0; arm < arms; arm++) {
        const armAngle = angle + arm * Math.PI / arms;
        const cos = Math.cos(armAngle);
        const sin = Math.sin(armAngle);
        segments.push({
          ax: x - cos * hazard.length,
          ay: y - sin * hazard.length,
          bx: x + cos * hazard.length,
          by: y + sin * hazard.length,
          x: x,
          y: y,
          angle: armAngle,
          type: hazard.type
        });
      }
      return segments;
    }

    function getCartState(cart) {
      const motion = stageTime * cart.speed + cart.phase;
      const offset = Math.sin(motion) * cart.range;
      const forward = Math.cos(motion) >= 0;
      return {
        x: cart.x + (cart.axis === 'x' ? offset : 0),
        y: cart.y + (cart.axis === 'y' ? offset : 0),
        rotation: cart.axis === 'x'
          ? (forward ? 0 : Math.PI)
          : (forward ? Math.PI / 2 : -Math.PI / 2)
      };
    }

    function getRollingCylinderState(cylinder) {
      const travelDistance = cylinder.to - cylinder.from;
      const distanceTravelled = stageTime * cylinder.speed + cylinder.phase * travelDistance;
      const progress = ((distanceTravelled % travelDistance) + travelDistance) % travelDistance / travelDistance;
      const directedProgress = cylinder.direction < 0 ? 1 - progress : progress;
      const position = cylinder.from + directedProgress * travelDistance;
      const x = cylinder.axis === 'x' ? position : cylinder.fixed;
      const y = cylinder.axis === 'y' ? position : cylinder.fixed;
      const angle = cylinder.axis === 'x' ? Math.PI / 2 : 0;
      const direction = cylinder.direction < 0 ? -1 : 1;
      const directionX = cylinder.axis === 'x' ? direction : 0;
      const directionY = cylinder.axis === 'y' ? direction : 0;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: x,
        y: y,
        angle: angle,
        ax: x - cos * cylinder.length,
        ay: y - sin * cylinder.length,
        bx: x + cos * cylinder.length,
        by: y + sin * cylinder.length,
        spin: distanceTravelled / 9 * direction,
        directionX: directionX,
        directionY: directionY,
        heading: Math.atan2(directionY, directionX)
      };
    }

    function getTrapProgress(trap) {
      return ((stageTime + trap.phase) % trap.period) / trap.period;
    }

    function isTrapActive(type, progress) {
      if (type === 'crusher') return progress >= 0.58 && progress <= 0.73;
      if (type === 'vent') return progress >= 0.52 && progress <= 0.76;
      if (type === 'rockfall') return progress >= 0.76 && progress <= 0.9;
      return progress >= 0.48 && progress <= 0.78;
    }

    function updatePlayer(dt) {
      let dx = 0;
      let dy = 0;
      if (keys.ArrowLeft || keys.KeyA) dx -= 1;
      if (keys.ArrowRight || keys.KeyD) dx += 1;
      if (keys.ArrowUp || keys.KeyW) dy -= 1;
      if (keys.ArrowDown || keys.KeyS) dy += 1;

      const length = Math.hypot(dx, dy);
      player.moving = length > 0;
      if (length > 0) {
        if (Math.abs(dx) > Math.abs(dy)) {
          player.direction = dx < 0 ? 'left' : 'right';
        } else {
          player.direction = dy < 0 ? 'up' : 'down';
        }
        dx /= length;
        dy /= length;
        player.angle = Math.atan2(dy, dx);
        const speedBoost = getJumpHeight() > 0.15 ? 1.08 : 1;
        movePlayer(dx * player.speed * speedBoost * dt, dy * player.speed * speedBoost * dt);
        player.step += dt * 8;
        const footstep = Math.floor(player.step / 2);
        if (footstep !== lastFootstep && getJumpHeight() < 0.08) {
          lastFootstep = footstep;
          playFootstep();
        }
      }

      if (player.jumpTimer > 0) player.jumpTimer = Math.max(0, player.jumpTimer - dt);
      if (player.jumpCooldown > 0) player.jumpCooldown = Math.max(0, player.jumpCooldown - dt);
      if (player.invulnerable > 0) player.invulnerable = Math.max(0, player.invulnerable - dt);
    }

    function updateHazards() {
      if (player.invulnerable > 0 || getJumpHeight() > 0.23) return;
      for (const hazard of stage.hazards) {
        const segments = getHazardSegments(hazard);
        for (const segment of segments) {
          if (pointSegmentDistance(player.x, player.y, segment.ax, segment.ay, segment.bx, segment.by) < PLAYER_RADIUS + 13) {
            hitPlayer(segment.x, segment.y);
            return;
          }
        }
      }

      for (const cart of stage.carts || []) {
        const cartState = getCartState(cart);
        if (distance(player.x, player.y, cartState.x, cartState.y) < PLAYER_RADIUS + 24) {
          hitPlayer(cartState.x, cartState.y);
          return;
        }
      }

      for (const cylinder of ROLLING_CYLINDERS_BY_STAGE[stageIndex] || []) {
        const cylinderState = getRollingCylinderState(cylinder);
        if (pointSegmentDistance(
          player.x,
          player.y,
          cylinderState.ax,
          cylinderState.ay,
          cylinderState.bx,
          cylinderState.by
        ) < PLAYER_RADIUS + 16) {
          hitPlayer(cylinderState.x, cylinderState.y);
          return;
        }
      }

      const trapGroups = [
        ['crusher', stage.crushers || []],
        ['vent', stage.vents || []],
        ['rockfall', stage.rockfalls || []],
        ['lava', stage.lavaVents || []]
      ];
      for (const group of trapGroups) {
        const type = group[0];
        for (const trap of group[1]) {
          if (isTrapActive(type, getTrapProgress(trap)) &&
              distance(player.x, player.y, trap.x, trap.y) < PLAYER_RADIUS + trap.radius) {
            hitPlayer(trap.x, trap.y);
            return;
          }
        }
      }
    }

    function hitPlayer(sourceX, sourceY) {
      player.lives -= 1;
      player.invulnerable = 1.6;
      shake = 12;
      const angle = Math.atan2(player.y - sourceY, player.x - sourceX);
      movePlayer(Math.cos(angle) * 25, Math.sin(angle) * 25);
      burst(player.x, player.y, '#ff6b57', 18, 125);
      playHitSfx();

      if (player.lives <= 0) {
        state = 'gameover';
        stopMusic(0.55);
        tone(92, 0.5, 'triangle', 0.045, 46, 0.18);
        showEndOverlay('gameover');
      } else {
        showMessage('보호 장비 손상 · ' + player.lives + '칸 남음', '#ff806f', 1.5);
      }
    }

    function updateObjectives() {
      for (const repair of repairs) {
        if (!repair.collected && player.lives < MAX_LIVES &&
            distance(player.x, player.y, repair.x, repair.y) < PLAYER_RADIUS + 20) {
          repair.collected = true;
          player.lives += 1;
          burst(repair.x, repair.y, '#78f2c2', 22, 110);
          playRepairSfx();
          showMessage('보호 장비 1칸 수리', '#78f2c2', 1.5);
        }
      }

      for (const mineral of minerals) {
        if (!mineral.collected && distance(player.x, player.y, mineral.x, mineral.y) < PLAYER_RADIUS + 14) {
          mineral.collected = true;
          const count = minerals.filter(function (item) { return item.collected; }).length;
          burst(mineral.x, mineral.y, mineral.color, 16, 92);
          playMineralSfx(count);
          if (count === TOTAL_MINERALS) {
            showMessage('광물 확보 완료 · 열쇠함 활성화', '#6ee7b7', 2);
          } else {
            showMessage('광물 ' + count + ' / ' + TOTAL_MINERALS, mineral.color, 1.1);
          }
        }
      }

      const collected = minerals.filter(function (item) { return item.collected; }).length;
      if (collected === TOTAL_MINERALS && !chestOpen &&
          distance(player.x, player.y, stage.chest.x, stage.chest.y) < 42) {
        chestOpen = true;
        hasKey = true;
        burst(stage.chest.x, stage.chest.y, '#f7b955', 28, 130);
        playChestSfx();
        showMessage('탈출 열쇠 획득', '#f7c86d', 1.8);
      }

      if (hasKey && distance(player.x, player.y, stage.door.x, stage.door.y) < 45) {
        const finalDoor = stageIndex === STAGES.length - 1;
        hasKey = false;
        burst(stage.door.x, stage.door.y, stage.accent, 30, 160);
        playDoorSfx(finalDoor);
        if (finalDoor) {
          state = 'win';
          stopMusic(1.1);
          showEndOverlay('win');
        } else {
          state = 'transition';
          transitionTimer = 1.5;
          transitionLoaded = false;
        }
      }
    }

    function burst(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = speed * (0.3 + Math.random() * 0.7);
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          life: 0.45 + Math.random() * 0.45,
          maxLife: 0.9,
          size: 1.5 + Math.random() * 3.5,
          color: color
        });
      }
    }

    function updateParticles(dt) {
      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= Math.pow(0.03, dt);
        particle.vy *= Math.pow(0.03, dt);
        particle.life -= dt;
      }
      particles = particles.filter(function (particle) { return particle.life > 0; });
    }

    function update(dt) {
      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toast.classList.remove('show');
      }

      updateParticles(dt);
      if (state === 'playing') {
        stageTime += dt;
        updatePlayer(dt);
        updateHazards();
        if (state === 'playing') updateObjectives();
      } else if (state === 'transition') {
        transitionTimer -= dt;
        if (transitionTimer < 0.78 && !transitionLoaded) {
          stageIndex += 1;
          setupStage(stageIndex);
          playStageStinger(stageIndex);
          transitionLoaded = true;
        }
        if (transitionTimer <= 0) state = 'playing';
      }

      shake *= Math.pow(0.015, dt);
    }

    function drawFloor() {
      ctx.fillStyle = '#080b09';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawSprite(
        FLOOR_SPRITES[stageIndex],
        (FLOOR.left + FLOOR.right) / 2,
        (FLOOR.top + FLOOR.bottom) / 2,
        FLOOR.right - FLOOR.left,
        FLOOR.bottom - FLOOR.top,
        { filter: ENVIRONMENT_FILTERS[stageIndex] }
      );

      for (const speck of dust) {
        ctx.fillStyle = 'rgba(220, 230, 220,' + speck.alpha * 0.35 + ')';
        ctx.fillRect(speck.x, speck.y, speck.size, speck.size);
      }

      drawTrackLines();
      drawCaveBorder();
    }

    function drawCaveBorder() {
      const horizontalWidth = FLOOR.right - FLOOR.left + 34;
      const verticalWidth = FLOOR.bottom - FLOOR.top + 34;
      const horizontalCenter = (FLOOR.left + FLOOR.right) / 2;
      const verticalCenter = (FLOOR.top + FLOOR.bottom) / 2;
      const filter = ENVIRONMENT_FILTERS[stageIndex] + ' drop-shadow(0 5px 5px rgba(0, 0, 0, 0.7))';

      drawSprite('caveEdge', horizontalCenter, FLOOR.top - 3, horizontalWidth, 48, { filter: filter });
      drawSprite('caveEdge', horizontalCenter, FLOOR.bottom + 3, horizontalWidth, 48, {
        rotation: Math.PI,
        filter: filter
      });
      drawSprite('caveEdge', FLOOR.left - 3, verticalCenter, verticalWidth, 48, {
        rotation: -Math.PI / 2,
        filter: filter
      });
      drawSprite('caveEdge', FLOOR.right + 3, verticalCenter, verticalWidth, 48, {
        rotation: Math.PI / 2,
        filter: filter
      });
    }

    function drawTrackLines() {
      for (const rail of stage.rails || []) {
        drawSprite('mineRail', rail.x, rail.y, rail.w, 58, {
          rotation: rail.angle,
          alpha: 0.72,
          filter: 'brightness(0.72) saturate(0.78) drop-shadow(0 5px 4px rgba(0, 0, 0, 0.42))'
        });
      }
    }

    function drawGroundLamp() {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const radius = 126 + getJumpHeight() * 12;
      const glow = ctx.createRadialGradient(player.x, player.y, 5, player.x, player.y, radius);
      glow.addColorStop(0, 'rgba(255, 210, 115, 0.28)');
      glow.addColorStop(0.38, 'rgba(237, 164, 67, 0.16)');
      glow.addColorStop(1, 'rgba(237, 164, 67, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(player.x, player.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWalls() {
      for (const wall of stage.walls) {
        const horizontal = wall.w > wall.h;
        const length = horizontal ? wall.w : wall.h;
        const filter = ENVIRONMENT_FILTERS[stageIndex] + ' drop-shadow(0 7px 5px rgba(0, 0, 0, 0.68))';
        drawSprite(
          'mineWall',
          wall.x + wall.w / 2,
          wall.y + wall.h / 2,
          length + 8,
          44,
          {
            rotation: horizontal ? 0 : Math.PI / 2,
            filter: filter
          }
        );
      }
    }

    function drawMinerals() {
      for (const mineral of minerals) {
        if (mineral.collected) continue;
        const pulse = 1 + Math.sin(stageTime * 3.2 + mineral.phase) * 0.08;
        drawMineralSprite(mineral, mineral.x, mineral.y, 39 * pulse, true);
      }
    }

    function drawChest() {
      const collected = minerals.filter(function (item) { return item.collected; }).length;
      const ready = collected === TOTAL_MINERALS;
      const x = stage.chest.x;
      const y = stage.chest.y;
      ctx.save();
      ctx.translate(x, y);

      if (ready && !chestOpen) {
        ctx.globalAlpha = 0.25 + Math.sin(stageTime * 4) * 0.08;
        ctx.fillStyle = '#f7b955';
        ctx.beginPath();
        ctx.ellipse(0, 12, 38, 20, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      if (chestOpen) {
        drawSprite('chestOpen', x, y - 4, 58, 70, {
          filter: 'drop-shadow(0 8px 7px rgba(0, 0, 0, 0.58))'
        });
        const keyY = y - 38 + Math.sin(stageTime * 4.2) * 2.5;
        drawSprite('key', x, keyY, 34, 16, {
          filter: 'drop-shadow(0 0 7px #f7b955)'
        });
      } else {
        drawSprite('chestClosed', x, y, 63, 50, {
          filter: ready
            ? 'drop-shadow(0 0 10px #f7b955) drop-shadow(0 7px 6px rgba(0, 0, 0, 0.58))'
            : 'drop-shadow(0 7px 6px rgba(0, 0, 0, 0.58))'
        });
      }
    }

    function drawDoor() {
      const x = stage.door.x;
      const y = stage.door.y;
      const unlocked = hasKey;
      const rotation = stage.door.side === 'right' ? Math.PI / 2 : 0;
      drawSprite(unlocked ? 'doorOpen' : 'doorLocked', x, y, unlocked ? 76 : 70, unlocked ? 79 : 80, {
        rotation: rotation,
        filter: unlocked
          ? 'drop-shadow(0 0 ' + (10 + Math.sin(stageTime * 5) * 3) + 'px ' + stage.accent + ')'
          : 'drop-shadow(0 8px 8px rgba(0, 0, 0, 0.65))'
      });
    }

    function drawHazardTrack(hazard) {
      ctx.save();
      ctx.strokeStyle = 'rgba(226, 232, 228, 0.18)';
      ctx.fillStyle = 'rgba(226, 232, 228, 0.22)';
      ctx.lineWidth = 4;

      if (hazard.type === 'slider') {
        ctx.setLineDash([9, 8]);
        ctx.beginPath();
        if (hazard.axis === 'x') {
          ctx.moveTo(hazard.x - hazard.range, hazard.y);
          ctx.lineTo(hazard.x + hazard.range, hazard.y);
        } else {
          ctx.moveTo(hazard.x, hazard.y - hazard.range);
          ctx.lineTo(hazard.x, hazard.y + hazard.range);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        if (hazard.axis === 'x') {
          drawMotionArrow(hazard.x - hazard.range, hazard.y, Math.PI);
          drawMotionArrow(hazard.x + hazard.range, hazard.y, 0);
        } else {
          drawMotionArrow(hazard.x, hazard.y - hazard.range, -Math.PI / 2);
          drawMotionArrow(hazard.x, hazard.y + hazard.range, Math.PI / 2);
        }
      } else {
        const direction = hazard.speed >= 0 ? 1 : -1;
        const radius = Math.min(48, hazard.length * 0.72);
        const start = direction > 0 ? -Math.PI * 0.2 : Math.PI * 1.2;
        const end = start + direction * Math.PI * 1.35;
        ctx.setLineDash([9, 8]);
        ctx.beginPath();
        ctx.arc(hazard.x, hazard.y, radius, start, end, direction < 0);
        ctx.stroke();
        ctx.setLineDash([]);
        drawMotionArrow(
          hazard.x + Math.cos(end) * radius,
          hazard.y + Math.sin(end) * radius,
          end + direction * Math.PI / 2
        );
      }
      ctx.restore();
    }

    function drawMotionArrow(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-5, -6);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-5, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawHazards() {
      for (const hazard of stage.hazards) drawHazardTrack(hazard);

      for (const hazard of stage.hazards) {
        const segments = getHazardSegments(hazard);
        for (const segment of segments) drawSpikedBar(segment);
        if (hazard.type !== 'spinner') continue;
        const hub = segments[0];
        ctx.save();
        ctx.translate(hub.x, hub.y);
        ctx.fillStyle = '#171b18';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#98a29c';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = stage.accent;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawDangerRing(x, y, radius, progress, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = 0.36 + Math.sin(stageTime * 12) * 0.12;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.setLineDash([7, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha *= 0.16;
      ctx.beginPath();
      ctx.arc(0, 0, radius - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSteamBurst(vent, progress) {
      const strength = Math.sin(clamp((progress - 0.52) / 0.24, 0, 1) * Math.PI);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < 7; i++) {
        const phase = (stageTime * (0.65 + i * 0.04) + i * 0.17) % 1;
        const angle = i / 7 * Math.PI * 2 + stageTime * 0.35;
        const distanceFromVent = 9 + phase * vent.radius * 0.82;
        const alpha = (1 - phase) * 0.25 * strength;
        ctx.fillStyle = 'rgba(207, 245, 238,' + alpha + ')';
        ctx.beginPath();
        ctx.arc(
          vent.x + Math.cos(angle) * distanceFromVent,
          vent.y + Math.sin(angle) * distanceFromVent,
          5 + phase * 11,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
      ctx.restore();
    }

    function drawLavaBurst(vent, progress) {
      const active = isTrapActive('lava', progress);
      const pulse = active ? 1 + Math.sin(stageTime * 14) * 0.08 : 1;
      if (active) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const glow = ctx.createRadialGradient(vent.x, vent.y, 8, vent.x, vent.y, vent.radius * 1.35);
        glow.addColorStop(0, 'rgba(255, 216, 72, 0.66)');
        glow.addColorStop(0.42, 'rgba(255, 84, 28, 0.34)');
        glow.addColorStop(1, 'rgba(255, 62, 20, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(vent.x, vent.y, vent.radius * 1.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      drawSprite('lavaVent', vent.x, vent.y, 72 * pulse, 72 * pulse, {
        filter: active
          ? 'brightness(1.35) saturate(1.25) drop-shadow(0 0 13px #ff572e)'
          : 'brightness(0.72) saturate(0.74) drop-shadow(0 6px 5px rgba(0, 0, 0, 0.58))'
      });
    }

    function drawStageMechanics() {
      for (const cylinder of ROLLING_CYLINDERS_BY_STAGE[stageIndex] || []) {
        const cylinderState = getRollingCylinderState(cylinder);
        const rollerWidth = cylinder.length * 2 + 24;

        ctx.save();
        ctx.fillStyle = stage.accent;
        for (let arrow = 1; arrow <= 3; arrow++) {
          ctx.globalAlpha = 0.24 - arrow * 0.045;
          drawMotionArrow(
            cylinderState.x - cylinderState.directionX * (rollerWidth / 2 + arrow * 18),
            cylinderState.y - cylinderState.directionY * (rollerWidth / 2 + arrow * 18),
            cylinderState.heading
          );
        }
        ctx.restore();

        drawSprite('spikeRoller', cylinderState.x, cylinderState.y, rollerWidth, 38, {
          rotation: cylinderState.angle,
          filter: 'drop-shadow(0 8px 7px rgba(0, 0, 0, 0.72))'
        });

        ctx.save();
        ctx.translate(cylinderState.x, cylinderState.y);
        ctx.rotate(cylinderState.angle);
        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = '#f5d79a';
        ctx.lineWidth = 2;
        const glintY = Math.sin(cylinderState.spin) * 7;
        ctx.beginPath();
        ctx.moveTo(-cylinder.length * 0.7, glintY);
        ctx.lineTo(cylinder.length * 0.7, glintY);
        ctx.stroke();
        ctx.restore();
      }

      for (const cart of stage.carts || []) {
        const cartState = getCartState(cart);
        drawSprite('minecart', cartState.x, cartState.y, 76, 76, {
          rotation: cartState.rotation,
          filter: 'drop-shadow(0 8px 6px rgba(0, 0, 0, 0.7))'
        });
      }

      for (const crusher of stage.crushers || []) {
        const progress = getTrapProgress(crusher);
        const warning = progress >= 0.36 && progress < 0.58;
        const active = isTrapActive('crusher', progress);
        if (warning) drawDangerRing(crusher.x, crusher.y, crusher.radius + 5, (progress - 0.36) / 0.22, '#ffd24f');
        const slam = active ? 1.12 + Math.sin(progress * 38) * 0.03 : 0.84;
        drawSprite('crusher', crusher.x, crusher.y, 78 * slam, 78 * slam, {
          filter: active
            ? 'brightness(1.18) drop-shadow(0 0 12px #ff5144)'
            : 'brightness(0.78) drop-shadow(0 7px 6px rgba(0, 0, 0, 0.62))'
        });
      }

      for (const vent of stage.vents || []) {
        const progress = getTrapProgress(vent);
        const warning = progress >= 0.34 && progress < 0.52;
        if (warning) drawDangerRing(vent.x, vent.y, vent.radius, (progress - 0.34) / 0.18, '#9bf5e7');
        drawSprite('steamVent', vent.x, vent.y, 62, 62, {
          filter: isTrapActive('vent', progress)
            ? 'brightness(1.25) drop-shadow(0 0 10px #bff8ed)'
            : 'brightness(0.72) drop-shadow(0 6px 5px rgba(0, 0, 0, 0.6))'
        });
        if (isTrapActive('vent', progress)) drawSteamBurst(vent, progress);
      }

      for (const rockfall of stage.rockfalls || []) {
        const progress = getTrapProgress(rockfall);
        if (progress >= 0.3 && progress < 0.76) {
          drawDangerRing(rockfall.x, rockfall.y, rockfall.radius, (progress - 0.3) / 0.46, '#e2a96a');
        }
        if (progress >= 0.6 && progress <= 0.92) {
          const fall = clamp((progress - 0.6) / 0.2, 0, 1);
          const shadowScale = 0.35 + fall * 0.65;
          ctx.save();
          ctx.globalAlpha = 0.18 + fall * 0.34;
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.ellipse(rockfall.x, rockfall.y + 5, rockfall.radius * shadowScale, rockfall.radius * 0.45 * shadowScale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          drawSprite('boulder', rockfall.x, rockfall.y - (1 - fall) * 62, 62 * (0.5 + fall * 0.5), 62 * (0.5 + fall * 0.5), {
            rotation: stageTime * 1.8,
            filter: 'drop-shadow(0 10px 7px rgba(0, 0, 0, 0.72))'
          });
        }
      }

      for (const lavaVent of stage.lavaVents || []) {
        const progress = getTrapProgress(lavaVent);
        if (progress >= 0.28 && progress < 0.48) {
          drawDangerRing(lavaVent.x, lavaVent.y, lavaVent.radius, (progress - 0.28) / 0.2, '#ff7447');
        }
        drawLavaBurst(lavaVent, progress);
      }

      for (const repair of repairs) {
        if (repair.collected) continue;
        const bob = Math.sin(stageTime * 3.4 + repair.x) * 3;
        drawSprite('repairKit', repair.x, repair.y + bob, 52, 52, {
          filter: player.lives < MAX_LIVES
            ? 'brightness(1.08) drop-shadow(0 0 10px #78f2c2)'
            : 'brightness(0.66) saturate(0.72) drop-shadow(0 6px 5px rgba(0, 0, 0, 0.55))'
        });
      }
    }

    function drawSpikedBar(segment) {
      const dx = segment.bx - segment.ax;
      const dy = segment.by - segment.ay;
      const length = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const width = length + 22;
      const spriteName = segment.type === 'slider' ? 'spikeSlider' : 'spikeRoller';
      drawSprite(spriteName, segment.x, segment.y, width, Math.min(38, Math.max(30, length * 0.23)), {
        rotation: angle,
        filter: 'drop-shadow(0 7px 6px rgba(0, 0, 0, 0.68))'
      });
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.save();
        ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.fillStyle = particle.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawMiner() {
      const jumpHeight = getJumpHeight();
      const scale = 1 + jumpHeight * 0.48;
      const bob = player.moving && jumpHeight === 0 ? Math.sin(player.step * Math.PI / 2) * 0.6 : 0;
      const blink = player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0;
      const directionFrames = MINER_DIRECTION_FRAMES[player.direction];
      const walkFrame = 1 + Math.floor(player.step) % (directionFrames.length - 1);
      const spriteName = player.moving ? directionFrames[walkFrame] : directionFrames[0];

      ctx.save();
      ctx.translate(player.x, player.y + 8);
      ctx.scale(1 - jumpHeight * 0.25, 1 - jumpHeight * 0.25);
      ctx.globalAlpha = 0.42 - jumpHeight * 0.18;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (blink) return;

      drawSprite(
        spriteName,
        player.x,
        player.y - jumpHeight * 12 + bob,
        47 * scale,
        60 * scale,
        {
          filter: 'drop-shadow(0 5px 4px rgba(0, 0, 0, 0.55))'
        }
      );
    }

    function drawDarkness() {
      const jumpHeight = getJumpHeight();
      const radius = 154 + jumpHeight * 18;
      const gradient = ctx.createRadialGradient(player.x, player.y, 34, player.x, player.y, radius);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      gradient.addColorStop(0.36, 'rgba(0, 0, 0, 0.06)');
      gradient.addColorStop(0.72, 'rgba(0, 0, 0, 0.68)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0.965)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, HUD_HEIGHT, WIDTH, HEIGHT - HUD_HEIGHT);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const lampX = player.x + Math.cos(player.angle) * 42;
      const lampY = player.y + Math.sin(player.angle) * 42;
      const lamp = ctx.createRadialGradient(lampX, lampY, 0, lampX, lampY, 65);
      lamp.addColorStop(0, 'rgba(255, 226, 153, 0.18)');
      lamp.addColorStop(1, 'rgba(255, 226, 153, 0)');
      ctx.fillStyle = lamp;
      ctx.beginPath();
      ctx.arc(lampX, lampY, 65, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHud() {
      const collected = minerals.filter(function (item) { return item.collected; }).length;
      const hpColors = ['#ff6758', '#ff805b', '#ffae5d', '#9edb78', '#73db9f'];
      const hudLeft = Math.max(28, 62 * WIDTH / Math.max(1, window.innerWidth));
      ctx.save();
      ctx.fillStyle = 'rgba(7, 10, 8, 0.97)';
      ctx.fillRect(0, 0, WIDTH, HUD_HEIGHT);
      ctx.strokeStyle = '#303a34';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, HUD_HEIGHT - 0.5);
      ctx.lineTo(WIDTH, HUD_HEIGHT - 0.5);
      ctx.stroke();

      ctx.fillStyle = stage.accent;
      ctx.font = '800 11px Arial';
      ctx.fillText(stage.code + ' / ' + String(STAGES.length).padStart(2, '0'), hudLeft, 24);
      ctx.fillStyle = '#f3efe6';
      ctx.font = '800 19px Arial';
      ctx.fillText(stage.name, hudLeft, 48);

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      ctx.fillText('광물', 258, 23);
      for (let i = 0; i < TOTAL_MINERALS; i++) {
        const x = 270 + i * 27;
        drawMineralSprite(minerals[i], x, 43, 23, minerals[i].collected);
      }

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      ctx.fillText('열쇠', 446, 23);
      drawKeyIcon(472, 43, hasKey || chestOpen);

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      ctx.fillText('장비', 640, 23);
      for (let i = 0; i < MAX_LIVES; i++) {
        const x = 670 + i * 34;
        ctx.fillStyle = i < player.lives ? hpColors[player.lives - 1] : '#262d29';
        ctx.strokeStyle = i < player.lives ? '#ffd6cf' : '#4b554f';
        ctx.lineWidth = 1;
        roundedRectPath(ctx, x, 34, 25, 16, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = i < player.lives ? 'rgba(255,255,255,0.34)' : 'transparent';
        ctx.fillRect(x + 4, 37, 10, 3);
      }

      ctx.fillStyle = '#758079';
      ctx.font = '700 10px Arial';
      const objective = collected < TOTAL_MINERALS ? '광물 탐색' : (!chestOpen ? '열쇠함 이동' : '탈출문 이동');
      ctx.textAlign = 'right';
      ctx.fillText(objective, 870, 25);
      ctx.fillStyle = collected < TOTAL_MINERALS ? '#e8ece9' : stage.accent;
      ctx.font = '800 14px Arial';
      ctx.fillText(collected < TOTAL_MINERALS ? collected + ' / 5' : (chestOpen ? 'UNLOCKED' : 'READY'), 870, 47);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    function drawKeyIcon(x, y, active) {
      drawSprite('key', x, y, 38, 18, {
        alpha: active ? 1 : 0.22,
        filter: active
          ? 'drop-shadow(0 0 6px #f7b955)'
          : 'grayscale(1) brightness(0.16) contrast(0.8)'
      });
    }

    function drawTransition() {
      if (state !== 'transition') return;
      const progress = Math.abs(transitionTimer - 0.75) / 0.75;
      const alpha = 1 - clamp(progress, 0, 1);
      ctx.save();
      ctx.fillStyle = 'rgba(3, 5, 4,' + alpha + ')';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = stage.accent;
      ctx.textAlign = 'center';
      ctx.font = '800 12px Arial';
      ctx.fillText('DESCENDING', WIDTH / 2, HEIGHT / 2 - 18);
      ctx.fillStyle = '#f5f0e5';
      ctx.font = '800 32px Arial';
      ctx.fillText(stage.name, WIDTH / 2, HEIGHT / 2 + 20);
      ctx.restore();
    }

    function draw() {
      ctx.setTransform(renderScaleX, 0, 0, renderScaleY, 0, 0);
      ctx.save();
      if (shake > 0.3) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      drawFloor();
      drawGroundLamp();
      drawWalls();
      drawChest();
      drawDoor();
      drawMinerals();
      drawHazards();
      drawStageMechanics();
      drawParticles();
      drawMiner();
      drawDarkness();
      ctx.restore();
      drawHud();
      drawTransition();
    }

    function loop(now) {
      const dt = Math.min(0.034, Math.max(0, (now - lastTime) / 1000));
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', function (event) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) {
        event.preventDefault();
      }
      keys[event.code] = true;
      if (event.code === 'Space' && !event.repeat) {
        if (state === 'start' || state === 'gameover' || state === 'win') startGame();
        else tryJump();
      }
      if (event.code === 'Enter' && state !== 'playing' && state !== 'transition') startGame();
    });

    window.addEventListener('keyup', function (event) {
      keys[event.code] = false;
    });

    window.addEventListener('blur', function () {
      keys = {};
    });

    window.addEventListener('resize', resizeCanvas);

    startButton.addEventListener('click', startGame);

    if (window.MobileArcade) {
      window.MobileArcade.dpad({
        up: 'up',
        down: 'down',
        left: 'left',
        right: 'right'
      }, { side: 'left', tag: 'MOVE' });
      window.MobileArcade.actions([
        { label: 'JUMP', key: 'space' }
      ], { side: 'right', bottom: '42px' });
    }

    resizeCanvas();
    setupStage(0);
    toast.classList.remove('show');
    requestAnimationFrame(loop);
  </script>
</body>

</html>
